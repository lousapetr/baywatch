server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    autoindex off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Forecast written by the fetcher
    location /data/ {
        alias /usr/share/nginx/data/;
        add_header Cache-Control "public, max-age=300";
    }

    # Fetch status: always revalidate so the app sees failures promptly
    location = /data/status.json {
        alias /usr/share/nginx/data/status.json;
        add_header Cache-Control "no-cache";
    }

    # Content-hashed build output
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # index.html, sw.js, icons: always revalidate so updates reach installed PWAs
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
