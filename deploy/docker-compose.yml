name: baywatch

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro,z
      - ./data:/usr/share/nginx/data:ro,z
      - ./nginx:/etc/nginx/conf.d:ro,z
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

  # One-shot job, started by cron: docker compose run --rm fetcher
  fetcher:
    image: node:22-alpine
    profiles: ["job"]
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /app
    volumes:
      - ./fetcher:/app:ro,z
      - ./data:/data:z
    environment:
      - OUT_DIR=/data
    command: ["node", "fetch.mjs"]
