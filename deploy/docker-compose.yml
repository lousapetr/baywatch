name: baywatch

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro,z
      - ./data:/usr/share/nginx/data:ro,z
      - ./nginx:/etc/nginx/conf.d:ro,z
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

  # One-shot job, started by cron: docker compose run --rm fetcher
  fetcher:
    image: node:22-alpine
    profiles: ["job"]
    user: "${PUID:-1000}:${PGID:-1000}"
    working_dir: /app
    volumes:
      - ./fetcher:/app:ro,z
      - ./data:/data:z
    environment:
      - OUT_DIR=/data
    # Hard 120 s limit per attempt; one retry after 60 s (FETCH_RETRY=1 keeps it
    # from counting as a second failure in status.json).
    command:
      - sh
      - -c
      - |
        timeout -s KILL 120 node fetch.mjs || { sleep 60; FETCH_RETRY=1 timeout -s KILL 120 node fetch.mjs; }
